- stage: E2E
  displayName: 'Playwright E2E'
  dependsOn:
  - Backend
  - Frontend

  jobs:
  - job: PlaywrightE2E
    displayName: 'Run Playwright end-to-end suite'

    variables:
    - name: CI
      value: 'true'
    - name: BASE_URL
      value: 'https://complex-mat.vercel.app/'

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - task: CmdLine@2
      displayName: 'Install frontend dependencies'
      inputs:
        script: |
          set -e
          npm ci
        workingDirectory: 'frontend'

    - task: CmdLine@2
      displayName: 'Install Playwright browsers'
      inputs:
        script: |
          set -e
          npx playwright install --with-deps chromium
        workingDirectory: 'frontend'

    - task: CmdLine@2
      displayName: 'Run Playwright tests'
      inputs:
        script: |
          set -e
          npm run test:e2e
        workingDirectory: 'frontend'

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'frontend/playwright-report/results.xml'
        testRunTitle: 'Playwright E2E'

    - task: PublishPipelineArtifact@1
      condition: succeededOrFailed()
      inputs:
        targetPath: 'frontend/playwright-report'
        artifact: 'playwright-report'
        publishLocation: 'pipeline'